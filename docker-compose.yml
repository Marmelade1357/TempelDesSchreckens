name: tempel-des-schreckens

services:
  app:
    build: .
    environment:
      - TZ=Europe/Berlin
    ports:
      # Nur intern auf dem Pi erreichbar (127.0.0.1:8096) - ein bereits
      # laufender Reverse Proxy auf dem Pi kann eine Subdomain (z.B.
      # tempel.oualid.de) hierher routen, analog zu wd.oualid.de -> 8092
      # (Der Widerstand). Port 8096 gewählt, weil 8080/8081/8090/8091/8092/
      # 8093/8094/8095/8443 schon von anderen Projekten (FinanceAgent,
      # Monitoring Shop, Widerstand, Wizard, Spielehub, Poker, Bluff)
      # belegt sind.
      - "127.0.0.1:8096:3000"
    restart: unless-stopped
